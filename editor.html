<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Editor — BOOGIE! PLAYGROUND</title>
<style>
:root{--ink:#1c1a2e;--mute:#6d7183;--line:#e6e8ee;--teal:#1b8f96;--blue:#2a7ea6;--rasp:#d62f5c;--butter:#e6ec98;--bg:#f2f4f8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);padding:0 0 90px}
.top{background:linear-gradient(120deg,#dff1f2,#e4eef7 55%,#f3e6ec);color:var(--ink);padding:22px 16px 56px}
.top .in{max-width:900px;margin:0 auto}.top h1{font-size:26px;letter-spacing:-.6px}.top h1 b{color:var(--teal)}.top p{color:var(--mute);font-size:13px;margin-top:6px;line-height:1.55;max-width:620px}
.wrap{max-width:900px;margin:-38px auto 0;padding:0 14px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid #eef0f4;box-shadow:0 6px 18px rgba(28,26,46,.05)}.card h3{font-size:15px;margin-bottom:8px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px;font-weight:700}
input,select,textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--teal)}input[type=checkbox]{width:auto}
button{font:inherit;font-weight:700;font-size:13px;padding:10px 16px;border-radius:12px;border:0;background:var(--ink);color:#fff;cursor:pointer;transition:.15s}
button:hover{transform:translateY(-1px)}button:disabled{opacity:.5;cursor:wait}
.b-main{background:linear-gradient(90deg,var(--teal),var(--blue))}.g{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.r{background:#fde0e8;color:#b0213f}.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:4px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 75%,transparent)}
.tabs button{white-space:nowrap;background:#fff;color:var(--ink);border:1.5px solid var(--line);padding:10px 14px}.tabs button.on{color:#fff;border-color:transparent;background:var(--c,var(--ink));box-shadow:0 6px 14px rgba(28,26,46,.2)}
.tabs i{font-style:normal;font-size:11px;background:rgba(0,0,0,.1);padding:1px 7px;border-radius:99px;margin-left:5px}.tabs .on i{background:rgba(255,255,255,.25)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:140px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#eceff3;color:var(--mute)}.pill.on{background:#d9f3ea;color:#0e7a55}.pill.up{background:#fff0c8;color:#8a6200}.pill.has{background:#e0eefc;color:#1d5f94}
.muted{color:var(--mute);font-size:12px;line-height:1.55}
.it{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid #eef0f4;border-left:6px solid var(--c,var(--line));margin-bottom:8px;box-shadow:0 3px 10px rgba(28,26,46,.04)}
.it .t{flex:1;min-width:0}.it .t b{display:block;font-size:14px;line-height:1.35;word-break:break-word}.it .a{display:flex;gap:6px;flex:none}
.it img.th{width:76px;height:46px;border-radius:9px;object-fit:cover;background:#e8ebf0;flex:none}
@media(max-width:560px){.it{flex-wrap:wrap}.it .a{width:100%}.it .a button{flex:1}}
.addbtn{width:100%;padding:15px;font-size:15px;border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,var(--rasp),#ec5a2c);box-shadow:0 8px 20px rgba(214,47,92,.28)}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;padding:14px 20px;border-radius:99px;box-shadow:0 10px 24px rgba(28,26,46,.35);font-size:14px;background:linear-gradient(90deg,var(--rasp),#ec5a2c)}
#msg{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:60;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;display:none;max-width:92vw;box-shadow:0 10px 24px rgba(0,0,0,.2)}
#msg.ok{display:block;background:#0e7a55;color:#fff}#msg.bad{display:block;background:#b0213f;color:#fff}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,94vw);max-height:92vh;box-shadow:0 30px 70px rgba(0,0,0,.4)}dialog::backdrop{background:rgba(28,26,46,.55)}
dialog .hd{padding:16px 18px;background:#e4eef7;color:var(--ink);font-weight:800;font-size:16px}
dialog .bd{padding:6px 18px 12px;overflow:auto;max-height:68vh}dialog .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:flex;gap:6px;align-items:center;margin:0;padding:6px 11px;border:1.5px solid var(--line);border-radius:99px;font-size:12.5px;color:var(--ink);cursor:pointer;font-weight:700}.chips label:has(input:checked){background:var(--teal);border-color:var(--teal);color:#fff}.chips input{display:none}
.sec{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--teal);margin:16px 0 0;text-transform:uppercase}
.empty{text-align:center;color:var(--mute);padding:26px;font-size:13px}
</style></head><body>
<div class="top"><div class="in"><h1>BOOGIE! <b>Editor</b></h1><p>Tambah, ubah, atau hapus vote, jadwal, konten, foto, dan lagu. Semua tersimpan langsung ke GitHub dan muncul di web sekitar 1–2 menit kemudian. Salah input? Tekan Edit di item itu.</p></div></div>
<div class="wrap">
<div id="setup" class="card"><h3>Koneksi GitHub (sekali saja)</h3>
<div class="row"><div><label>Repo (akun/nama-repo)</label><input id="repo" placeholder="nblhwf/BOOGIE-PLAYGROUND"></div><div><label>Branch</label><input id="branch" value="main"></div></div>
<label>Token (fine-grained, izin Contents: Read and write, hanya untuk repo ini)</label><input id="token" type="password" placeholder="github_pat_...">
<p class="muted" style="margin-top:6px">Token hanya disimpan di browser ini. Jangan dipakai di komputer umum.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button id="conn" class="b-main">Simpan dan muat data</button><button class="g" id="forget">Hapus token dari browser ini</button></div></div>
<div id="app" style="display:none">
<div class="tabs" id="tabs"></div>
<div id="pane"></div>
</div></div>
<div id="msg"></div>
<dialog id="dlg"><form method="dialog" id="frm"><div class="hd" id="dh"></div><div class="bd" id="db"></div><div class="ft"><button type="button" class="g" id="dc">Batal</button><button type="submit" class="b-main" id="ds">Simpan</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),LS=k=>{try{return localStorage.getItem(k)||""}catch{return""}},SL=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const APPS=["Berriz","IDOL CHAMP","Mubeat","Muniverse","LiNC","Mnet Plus","Higher","Coogoong"];
const ETYPES=["Official content","Live broadcast","Music show","Award show","Festival","Guest appearance","Fan activities","Comeback release","Voting"];
const COL={v:"#d62f5c",e:"#2a7ea6",c:"#1b8f96",s:"#8a3d5e",f:"#ec5a2c",p:"#1c1a2e"};
let seed=null,sha=null,tab="v",q="";
const msg=(t,c)=>{const m=$("#msg");m.textContent=t;m.className=c;clearTimeout(msg.t);msg.t=setTimeout(()=>m.className="",c==="ok"?5000:8000)};
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const api=()=>`https://api.github.com/repos/${$("#repo").value.trim()}/contents/data/seed.json`;
const hdr=()=>({Authorization:"Bearer "+$("#token").value.trim(),Accept:"application/vnd.github+json"});
const br=()=>$("#branch").value.trim()||"main";
async function load(){
  const r=await fetch(api()+"?ref="+encodeURIComponent(br())+"&t="+Date.now(),{headers:hdr()});
  if(!r.ok)throw new Error(r.status===401||r.status===403?"Token ditolak. Cek izin Contents: Read and write.":r.status===404?"Repo atau file data/seed.json tidak ditemukan.":"Gagal memuat ("+r.status+")");
  const j=await r.json();sha=j.sha;seed=JSON.parse(b64d(j.content));["votes","events","content","moments","songs"].forEach(k=>seed[k]=seed[k]||[]);$("#setup").style.display="none";render();
}
async function save(note){
  const r=await fetch(api(),{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({message:note,content:b64e(JSON.stringify(seed,null,1)),sha,branch:br()})});
  if(!r.ok){await load().catch(()=>{});throw new Error(r.status===409||r.status===422?"File berubah di GitHub, data sudah dimuat ulang. Ulangi perubahanmu.":"Gagal menyimpan ("+r.status+")")}
  sha=(await r.json()).content.sha;msg("Tersimpan. Web ter-update sekitar 1–2 menit lagi.","ok");render();
}
const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta"}).format(new Date());
const vst=v=>{const t=today();return t>v.end_date?"selesai":t<v.start_date?"akan datang":"berlangsung"};
const wibLocal=iso=>{const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta",hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date(iso)).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}T${p.hour==="24"?"00":p.hour}:${p.minute}`};
const fmt=(iso,all)=>new Date(iso).toLocaleString("id-ID",{timeZone:"Asia/Jakarta",day:"numeric",month:"short",year:"numeric",...(all?{}:{hour:"2-digit",minute:"2-digit"})})+(all?"":" WIB");
async function ytInfo(id){
  for(const u of [`https://www.youtube.com/oembed?url=https://youtu.be/${id}&format=json`,`https://noembed.com/embed?url=https://youtu.be/${id}`]){
    try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();if(j.title)return j}catch{}}
  return null;
}
const ytId=u=>(String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/)||[])[1];
function cropJpeg(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{
  const W=480,H=600,k=Math.max(W/im.width,H/im.height),sw=W/k,sh=H/k,sx=(im.width-sw)/2,sy=Math.max(0,Math.min(im.height-sh,(im.height-sh)*.3));
  const c=document.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,W,H);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.82).split(",")[1])};im.onerror=()=>rej(new Error("Foto tidak bisa dibaca"));im.src=u})}

/* ---------- form dialog ---------- */
function ask(title,html,onOk){
  $("#dh").textContent=title;$("#db").innerHTML=html;const d=$("#dlg");let busy=false;
  $("#frm").onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$("#ds").disabled=true;
    try{const note=await onOk();d.close();if(note)await save(note)}catch(x){msg(x.message,"bad")}finally{busy=false;$("#ds").disabled=false}};
  $("#dc").onclick=()=>d.close();d.showModal();
}
const val=id=>$("#"+id).value.trim();
const chips=(sel=[])=>`<div class="chips">${APPS.map(a=>`<label><input type="checkbox" name="app" value="${esc(a)}" ${sel.includes(a)?"checked":""}>${esc(a)}</label>`).join("")}</div>`;
const pickedApps=()=>[...document.querySelectorAll('input[name=app]:checked')].map(x=>x.value);

/* ---------- VOTE ---------- */
function voteForm(i){
  const v=i==null?{apps:[],result:null}:seed.votes[i],r=v.result||{};
  ask(i==null?"Tambah vote":"Edit vote",`
  <div class="row"><div><label>Acara</label><input id="f_show" value="${esc(v.show||"")}" placeholder="mis. Show Champion"></div><div><label>Tahap</label><input id="f_phase" value="${esc(v.phase||"")}" placeholder="Pre-vote / Live vote"></div></div>
  <label>Aplikasi voting</label>${chips(v.apps||[])}
  <div class="row"><div><label>Mulai</label><input id="f_s" type="date" value="${esc(v.start_date||today())}"></div><div><label>Selesai</label><input id="f_e" type="date" value="${esc(v.end_date||today())}"></div></div>
  <label>Link vote langsung (dibuka saat pembaca menekan vote)</label><input id="f_u" value="${esc(v.url||"")}" placeholder="https://...">
  <div class="sec">Hasil (isi setelah vote selesai)</div>
  <div class="row"><div><label>Posisi / peringkat</label><input id="f_rk" value="${esc(r.rank??"")}" placeholder="mis. 1"></div><div><label>Link pengumuman</label><input id="f_ru" value="${esc(r.url??"")}" placeholder="https://..."></div></div>
  <label>Catatan</label><input id="f_rn" value="${esc(r.note??"")}" placeholder="mis. selisih suara">`,
  ()=>{const show=val("f_show"),phase=val("f_phase"),apps=pickedApps();if(!show||!phase)throw new Error("Isi acara dan tahap dulu.");if(!apps.length)throw new Error("Pilih minimal satu aplikasi.");if(val("f_e")<val("f_s"))throw new Error("Tanggal selesai harus setelah mulai.");
    const rk=val("f_rk"),rn=val("f_rn"),ru=val("f_ru");
    const o={...(i==null?{slug:"v-"+Date.now(),guide_url:null,source:""}:seed.votes[i]),show,phase,apps,start_date:val("f_s"),end_date:val("f_e"),url:val("f_u")||null,
      result:(rk||rn||ru)?{rank:rk===""?null:(isNaN(rk)?rk:+rk),note:rn,url:ru,at:new Date().toISOString()}:null,verified_at:new Date().toISOString()};
    if(i==null)seed.votes.push(o);else seed.votes[i]=o;return (i==null?"Tambah":"Edit")+" vote: "+show+" "+phase});
}
function tabVote(){
  const L=seed.votes.map((v,i)=>({v,i})).filter(({v})=>!q||(v.show+v.phase+v.apps.join(" ")).toLowerCase().includes(q));
  const ord={berlangsung:0,"akan datang":1,selesai:2};L.sort((a,b)=>ord[vst(a.v)]-ord[vst(b.v)]||a.v.start_date.localeCompare(b.v.start_date));
  return L.map(({v,i})=>{const s=vst(v),r=v.result;return `<div class="it" style="--c:${s==="berlangsung"?"#0e9f6e":s==="akan datang"?"#e0a100":"#c4c8d2"}"><div class="t"><b>${esc(v.show)} · ${esc(v.phase)}</b><div class="muted">${esc(v.apps.join(" & "))} · ${esc(v.start_date)} s/d ${esc(v.end_date)} ${v.url?"· ada link vote":"· <b style='color:#b0213f'>belum ada link vote</b>"}</div>
  <div style="margin-top:5px"><span class="pill ${s==="berlangsung"?"on":s==="akan datang"?"up":""}">${s}</span> ${r?`<span class="pill has">Hasil: ${esc(r.rank??"–")}${r.note?" · "+esc(r.note):""}</span>`:""}</div></div>
  <div class="a"><button class="g sm" data-act="vedit" data-i="${i}">Edit</button><button class="r sm" data-act="vdel" data-i="${i}">Hapus</button></div></div>`}).join("")||'<div class="empty">Belum ada vote. Tekan + Tambah.</div>';
}

/* ---------- JADWAL ---------- */
function eventForm(i){
  const e=i==null?{type:ETYPES[0]}:seed.events[i];
  ask(i==null?"Tambah jadwal":"Edit jadwal",`
  <label>Judul</label><input id="f_t" value="${esc(e.title||"")}" placeholder="mis. NCT DREAM di Na PD">
  <div class="row"><div><label>Jenis</label><select id="f_ty">${ETYPES.map(t=>`<option ${t===e.type?"selected":""}>${t}</option>`).join("")}${ETYPES.includes(e.type)?"":`<option selected>${esc(e.type)}</option>`}</select></div>
  <div><label>Tanggal dan jam (WIB)</label><input id="f_st" type="datetime-local" value="${e.start?wibLocal(e.start):""}"></div></div>
  <label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)"><input id="f_all" type="checkbox" ${e.all_day?"checked":""}> Seharian (jam belum diketahui)</label>
  <label>Link (YouTube, dll)</label><input id="f_u" value="${esc(e.url||"")}" placeholder="https://...">
  <label>Catatan</label><input id="f_n" value="${esc(e.note||"")}">`,
  ()=>{const t=val("f_t"),s=val("f_st");if(!t||!s)throw new Error("Isi judul dan tanggal dulu.");const all=$("#f_all").checked;
    const o={...(i==null?{slug:"manual-"+Date.now(),source:""}:seed.events[i]),type:$("#f_ty").value,title:t,start:all?s.slice(0,10)+"T00:00:00+07:00":s+":00+07:00",all_day:all,note:val("f_n"),url:val("f_u")||null,verified_at:new Date().toISOString()};
    if(i==null)seed.events.push(o);else seed.events[i]=o;return (i==null?"Tambah":"Edit")+" jadwal: "+t});
}
function tabEvent(){
  const now=Date.now(),L=seed.events.map((e,i)=>({e,i})).filter(({e})=>!q||(e.title+e.type).toLowerCase().includes(q));
  const up=L.filter(({e})=>new Date(e.start)>=now-864e5).sort((a,b)=>a.e.start<b.e.start?-1:1),past=L.filter(({e})=>new Date(e.start)<now-864e5).sort((a,b)=>a.e.start<b.e.start?1:-1);
  const row=({e,i})=>`<div class="it" style="--c:#2a7ea6"><div class="t"><b>${esc(e.title)}</b><div class="muted">${fmt(e.start,e.all_day)} · ${esc(e.type)}</div></div><div class="a"><button class="g sm" data-act="eedit" data-i="${i}">Edit</button><button class="r sm" data-act="edel" data-i="${i}">Hapus</button></div></div>`;
  return (up.length?`<div class="sec" style="margin:4px 0 8px">Akan datang / hari ini</div>${up.map(row).join("")}`:"")+(past.length?`<div class="sec" style="margin:14px 0 8px;color:var(--mute)">Sudah lewat</div>${past.map(row).join("")}`:"")||'<div class="empty">Belum ada jadwal.</div>';
}

/* ---------- KONTEN ---------- */
function contentForm(i){
  const c=i==null?{}:seed.content[i];
  ask(i==null?"Tambah konten YouTube":"Edit konten",`
  <label>Link YouTube (channel mana pun)</label><input id="f_l" value="${c.id?"https://youtu.be/"+esc(c.id):""}" placeholder="https://youtu.be/...">
  <label>Judul (kosongkan agar otomatis dari YouTube)</label><input id="f_t" value="${esc(c.title||"")}">
  <label>Label singkat (mis. Teaser, Na PD)</label><input id="f_g" value="${esc(c.tag||"")}">
  <p class="muted" style="margin-top:8px">Urutan di web mengikuti tanggal tayang di YouTube, terbaru paling depan.</p>`,
  async()=>{const id=ytId(val("f_l"));if(!id)throw new Error("Link YouTube tidak dikenali.");let title=val("f_t"),tag=val("f_g");
    if(!title||!tag){const info=await ytInfo(id);if(info){title=title||info.title;tag=tag||String(info.author_name||"").slice(0,18)}}
    const o={id,title:title||"",tag:tag||""};if(i==null)seed.content.unshift(o);else seed.content[i]=o;return (i==null?"Tambah":"Edit")+" konten YouTube"});
}
function tabContent(){
  return seed.content.map((c,i)=>({c,i})).filter(({c})=>!q||(c.title+c.tag+c.id).toLowerCase().includes(q)).map(({c,i})=>`<div class="it" style="--c:#1b8f96"><img class="th" loading="lazy" src="https://i.ytimg.com/vi/${esc(c.id)}/mqdefault.jpg" alt="" onerror="this.style.visibility='hidden'"><div class="t"><b>${esc(c.title||"(judul diisi otomatis di web)")}</b><div class="muted">${esc(c.tag||"tanpa label")} · youtu.be/${esc(c.id)}</div></div><div class="a"><button class="g sm" data-act="cedit" data-i="${i}">Edit</button><button class="r sm" data-act="cdel" data-i="${i}">Hapus</button></div></div>`).join("")||'<div class="empty">Belum ada konten.</div>';
}

/* ---------- LAGU ---------- */
function songForm(i){
  const s=i==null?{a:"DREAM AFTER DREAM",y:2026}:seed.songs[i];const albums=[...new Set(seed.songs.map(x=>x.a))];
  ask(i==null?"Tambah lagu":"Edit lagu",`
  <label>Judul lagu</label><input id="f_t" value="${esc(s.t||"")}">
  <div class="row"><div><label>Album / rilisan</label><input id="f_a" list="albs" value="${esc(s.a||"")}"><datalist id="albs">${albums.map(a=>`<option value="${esc(a)}">`).join("")}</datalist></div><div><label>Tahun (opsional)</label><input id="f_y" inputmode="numeric" value="${esc(s.y??"")}"></div></div>
  <p class="muted" style="margin-top:8px">Lagu dengan album "DREAM AFTER DREAM" masuk pilihan "Comeback saja" di DREAM PICK!.</p>`,
  ()=>{const t=val("f_t"),a=val("f_a");if(!t||!a)throw new Error("Isi judul dan album dulu.");const y=val("f_y").replace(/\D/g,"");const o={t,a};if(y)o.y=+y;
    if(i==null)seed.songs.push(o);else seed.songs[i]=o;return (i==null?"Tambah":"Edit")+" lagu: "+t});
}
function tabSong(){
  const L=seed.songs.map((s,i)=>({s,i})).filter(({s})=>!q||(s.t+s.a).toLowerCase().includes(q));
  return `<p class="muted" style="margin-bottom:10px">Total ${seed.songs.length} lagu untuk DREAM PICK!. Kalau ada yang kurang atau salah, tambah atau edit di sini.</p>`+L.map(({s,i})=>`<div class="it" style="--c:#8a3d5e"><div class="t"><b>${esc(s.t)}</b><div class="muted">${esc(s.a)}${s.y?" · "+s.y:""}</div></div><div class="a"><button class="g sm" data-act="sedit" data-i="${i}">Edit</button><button class="r sm" data-act="sdel" data-i="${i}">Hapus</button></div></div>`).join("")||'<div class="empty">Tidak ada lagu.</div>';
}

/* ---------- FOTO & PENGATURAN ---------- */
function tabPhoto(){
  const L=seed.moments;
  return `<div class="card"><h3>Tambah foto Comeback moments</h3><p class="muted">Foto dipotong otomatis jadi 4:5 supaya seragam. Boleh pilih banyak. Foto baru tampil paling depan.</p>
  <input id="pf" type="file" accept="image/*" multiple style="margin:10px 0"><button id="pup" class="b-main">Upload</button></div>
  <div class="card"><h3>Foto saat ini (${L.length})</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px">${L.map((m,i)=>`<div><img src="${esc(m.src)}" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:#eee"><button class="r sm" style="width:100%;margin-top:4px" data-act="pdel" data-i="${i}">Hapus</button></div>`).join("")}</div></div>`;
}
function tabSet(){
  const st=seed.settings||{},gc=st.goatcounter||"";
  return `<div class="card"><h3>Target views MV</h3><p class="muted">Kalau views melewati target, web otomatis pindah ke milestone berikutnya. Isi kalau mau target sendiri.</p>
  <label>Target (angka tanpa titik)</label><input id="tg" inputmode="numeric" value="${esc(st.target_views??"")}" placeholder="10000000"><button id="tgs" class="b-main" style="margin-top:10px">Simpan target</button></div>
  <div class="card"><h3>Statistik pengunjung (GoatCounter)</h3><p class="muted">Daftar gratis di goatcounter.com, pilih kode, isi di bawah. Lihat jumlah pengunjung di <b>kode.goatcounter.com</b>.</p>
  <label>Kode GoatCounter</label><input id="gcc" value="${esc(gc)}" placeholder="boogiefan"><div style="display:flex;gap:8px;margin-top:10px"><button id="gcs" class="b-main">Simpan</button>${gc?`<a href="https://${esc(gc)}.goatcounter.com" target="_blank" rel="noopener"><button class="g" type="button">Buka statistik</button></a>`:""}</div></div>
  <div class="card"><h3>Notifikasi (OneSignal)</h3><p class="muted">Isi App ID dari dashboard OneSignal (Settings → Keys &amp; IDs). Tombol "Aktifkan notifikasi" akan muncul di web.</p>
  <label>OneSignal App ID</label><input id="osi" value="${esc(st.onesignal_app_id||"")}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"><button id="oss" class="b-main" style="margin-top:10px">Simpan</button></div>
  <div class="card"><button class="g" id="forget">Keluar (hapus token dari browser ini)</button></div>`;
}

/* ---------- render ---------- */
const TABS=[["v","Vote",()=>seed.votes.length],["e","Jadwal",()=>seed.events.length],["c","Konten",()=>seed.content.length],["s","Lagu",()=>seed.songs.length],["f","Foto",()=>seed.moments.length],["p","Pengaturan",null]];
function render(){
  $("#app").style.display="block";
  $("#tabs").innerHTML=TABS.map(([k,l,n])=>`<button data-tab="${k}" class="${tab===k?"on":""}" style="--c:${COL[k]}">${l}${n?`<i>${n()}</i>`:""}</button>`).join("");
  const canAdd="vecs".includes(tab);const LBL={v:"vote",e:"jadwal",c:"konten",s:"lagu"};
  const search=canAdd?`<button class="addbtn" id="addb">+ Tambah ${LBL[tab]} baru</button><div class="bar"><input id="q" placeholder="Cari..." value="${esc(q)}"></div>`:"";
  const body={v:tabVote,e:tabEvent,c:tabContent,s:tabSong,f:tabPhoto,p:tabSet}[tab]();
  const keep=document.activeElement&&document.activeElement.id==="q";
  $("#pane").innerHTML=search+body;if(keep){const x=$("#q");x.focus();x.setSelectionRange(99,99)}
}
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.toLowerCase().trim();render()}});
const ADD={v:()=>voteForm(),e:()=>eventForm(),c:()=>contentForm(),s:()=>songForm()};
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("button");if(!t)return;
  try{
  if(t.id==="addb"){ADD[tab]&&ADD[tab]();return}
  if(t.dataset.tab){tab=t.dataset.tab;q="";render();return}
  const i=+t.dataset.i,a=t.dataset.act;
  if(a==="vedit")voteForm(i);if(a==="eedit")eventForm(i);if(a==="cedit")contentForm(i);if(a==="sedit")songForm(i);
  if(a==="vdel"&&confirm("Hapus vote ini?\n"+seed.votes[i].show+" · "+seed.votes[i].phase)){seed.votes.splice(i,1);await save("Hapus vote")}
  if(a==="edel"&&confirm("Hapus jadwal ini?\n"+seed.events[i].title)){seed.events.splice(i,1);await save("Hapus jadwal")}
  if(a==="cdel"&&confirm("Hapus konten ini dari web?")){seed.content.splice(i,1);await save("Hapus konten")}
  if(a==="sdel"&&confirm("Hapus lagu ini?\n"+seed.songs[i].t)){seed.songs.splice(i,1);await save("Hapus lagu")}
  if(a==="pdel"&&confirm("Hapus foto ini?")){seed.moments.splice(i,1);await save("Hapus foto")}
  if(t.id==="pup"){const fs=[...$("#pf").files];if(!fs.length)return msg("Pilih foto dulu.","bad");t.disabled=true;let n=0;
    for(const f of fs){const b64=await cropJpeg(f),name=`assets/photos/u-${Date.now()}-${n++}.jpg`;
      const r=await fetch(`https://api.github.com/repos/${$("#repo").value.trim()}/contents/${name}`,{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({message:"Tambah foto",content:b64,branch:br()})});
      if(!r.ok){t.disabled=false;throw new Error("Upload foto gagal ("+r.status+")")}seed.moments.unshift({src:name})}
    await save("Tambah foto Comeback moments")}
  if(t.id==="tgs"){const v=$("#tg").value.replace(/[^0-9]/g,"");seed.settings=seed.settings||{};if(v)seed.settings.target_views=+v;else delete seed.settings.target_views;await save("Ubah target views")}
  if(t.id==="oss"){const v=$("#osi").value.trim().replace(/[^\w-]/g,"");seed.settings=seed.settings||{};if(v)seed.settings.onesignal_app_id=v;else delete seed.settings.onesignal_app_id;await save("Atur notifikasi")}
  if(t.id==="gcs"){const v=$("#gcc").value.trim().replace(/[^\w-]/g,"");seed.settings=seed.settings||{};if(v)seed.settings.goatcounter=v;else delete seed.settings.goatcounter;await save("Atur statistik pengunjung")}
  if(t.id==="conn"){SL("repo",$("#repo").value);SL("branch",$("#branch").value);SL("token",$("#token").value);await load();msg("Terhubung.","ok")}
  if(t.id==="forget"){try{localStorage.removeItem("token")}catch{}$("#token").value="";seed=null;$("#app").style.display="none";$("#setup").style.display="";msg("Token dihapus dari browser ini.","ok")}
  }catch(e){msg(e.message,"bad")}
});
$("#repo").value=LS("repo");$("#branch").value=LS("branch")||"main";$("#token").value=LS("token");
if($("#repo").value&&$("#token").value)load().catch(e=>msg(e.message,"bad"));
</script></body></html>
