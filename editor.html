<div class="wrap">

<div class="row"><div><label>Repo (akun/nama-repo)</label><input id="repo" placeholder="nblhwf/BOOGIE-PLAYGROUND"></div><div><label>Branch</label><input id="branch" value="main"></div></div>
<label>Token (fine-grained, izin Contents: Read and write, hanya untuk repo ini)</label><input id="token" type="password" placeholder="github_pat_...">
<p class="muted" style="margin-top:6px">Token hanya disimpan di browser ini. Jangan dipakai di komputer umum.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button id="conn" class="b-main">Simpan dan muat data</button><button class="g" id="forget">Hapus token dari browser ini</button></div></div>

</div></div>

<script>
const $=s=>document.querySelector(s),LS=k=>{try{return localStorage.getItem(k)||""}catch{return""}},SL=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const APPS=["Berriz","IDOL CHAMP","Mubeat","Muniverse","LiNC","Mnet Plus","Higher","Coogoong"];
const ETYPES=["Official content","Live broadcast","Music show","Award show","Festival","Guest appearance","Recording","Album Event","Voting"];
const MEMB=["NCT DREAM","Renjun","Jeno","Haechan","Jaemin","Chenle","Jisung"];
const COL={h:"#1c1a2e",m:"#1c1a2e",a:"#e8336d",x:"#2a7ea6",r:"#6a4fd8",v:"#d62f5c",e:"#2a7ea6",c:"#1b8f96",s:"#8a3d5e",f:"#ec5a2c",p:"#1c1a2e"};
let seed=null,sha=null,tab="h",q="";
const msg=(t,c)=>{const m=$("#msg");m.textContent=t;m.className=c;clearTimeout(msg.t);msg.t=setTimeout(()=>m.className="",c==="ok"?5000:8000)};
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const api=()=>`https://api.github.com/repos/${$("#repo").value.trim()}/contents/data/seed.json`;
const hdr=()=>({Authorization:"Bearer "+$("#token").value.trim(),Accept:"application/vnd.github+json"});
const br=()=>$("#branch").value.trim()||"main";
async function load(){
  const r=await fetch(api()+"?ref="+encodeURIComponent(br())+"&t="+Date.now(),{headers:hdr()});
  if(!r.ok)throw new Error(r.status===401||r.status===403?"Token ditolak. Cek izin Contents: Read and write.":r.status===404?"Repo atau file data/seed.json tidak ditemukan.":"Gagal memuat ("+r.status+")");
  const j=await r.json();sha=j.sha;seed=JSON.parse(b64d(j.content));["votes","events","content","moments","songs","releases","announcements"].forEach(k=>seed[k]=seed[k]||[]);$("#setup").style.display="none";render();
}
async function save(note){
  const r=await fetch(api(),{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({message:note,content:b64e(JSON.stringify(seed,null,1)),sha,branch:br()})});
  if(!r.ok){await load().catch(()=>{});throw new Error(r.status===409||r.status===422?"File berubah di GitHub, data sudah dimuat ulang. Ulangi perubahanmu.":"Gagal menyimpan ("+r.status+")")}
  sha=(await r.json()).content.sha;msg("Tersimpan. Web ter-update sekitar 1–2 menit lagi.","ok");render();
}
const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta"}).format(new Date());
const vst=v=>{const t=today();if(v.deadline_at?new Date(v.deadline_at)<Date.now():t>v.end_date)return"selesai";return t<v.start_date?"akan datang":"berlangsung"};

const SQL=`-- Jalankan sekali di Supabase > SQL Editor. Ganti GANTI_KATA_SANDI.
create extension if not exists pgcrypto with schema extensions;
alter table editor_messages add column if not exists is_read boolean default false;
create table if not exists editor_admin(pass_hash text);
alter table editor_admin enable row level security;
delete from editor_admin;
insert into editor_admin values (encode(extensions.digest('GANTI_KATA_SANDI','sha256'),'hex'));
create or replace function read_messages(pass text) returns setof editor_messages
language plpgsql security definer set search_path=public,extensions as $$
begin
  if not exists(select 1 from editor_admin where pass_hash=encode(digest(pass,'sha256'),'hex')) then raise exception 'denied'; end if;
  return query select * from editor_messages order by created_at desc limit 300;
end $$;
create or replace function manage_message(pass text, msg_id bigint, act text) returns void
language plpgsql security definer set search_path=public,extensions as $$
begin
  if not exists(select 1 from editor_admin where pass_hash=encode(digest(pass,'sha256'),'hex')) then raise exception 'denied'; end if;
  if act='read' then update editor_messages set is_read=true where id=msg_id;
  elsif act='unread' then update editor_messages set is_read=false where id=msg_id;
  elsif act='delete' then delete from editor_messages where id=msg_id; end if;
end $$;
grant execute on function read_messages(text), manage_message(text,bigint,text) to anon;`;

  <label>Anon key (sama dengan di config.js)</label><input id="sbk" value="${esc(c.k)}" placeholder="eyJ...">
  <label>Kata sandi editor</label><input id="sbp" type="password" value="${esc(c.p)}">
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="b-main" id="sbs">Simpan dan muat pesan</button><button class="g" id="sbq">Lihat SQL pemasangan</button></div>
  <div id="sqlbox" style="display:none"><pre class="sql">${esc(SQL)}</pre><button class="g sm" id="sqlc" style="margin-top:8px">Salin SQL</button></div></div>`;
  if(!ready||!INBOX)return cfg+(ready?'<div class="empty">Tekan "Simpan dan muat pesan".</div>':"");
  const L=INBOX;
  return (L.length?`<div class="muted" style="margin:2px 2px 10px">${L.length} pesan · ${L.filter(m=>!m.is_read).length} belum dibaca</div>`:"")+L.map(m=>`<div class="msgc ${m.is_read?"":"unread"}"><div><span class="pill ${m.kind==="Missing schedule"?"up":"has"}">${esc(m.kind||"")}</span> <span class="muted">${esc(fmt(m.created_at))}${m.lang?" · "+esc(m.lang):""}</span></div><p>${esc(m.message)}</p>${/^https:\/\//.test(m.source_url||"")?`<a href="${esc(m.source_url)}" target="_blank" rel="noopener" class="muted" style="color:var(--blue);font-weight:700">${esc(m.source_url)}</a>`:""}<div style="display:flex;gap:6px;margin-top:10px"><button class="g sm" data-act="mread" data-id="${m.id}" data-r="${m.is_read?0:1}">${m.is_read?"Tandai belum dibaca":"Tandai dibaca"}</button><button class="r sm" data-act="mdel" data-id="${m.id}">Hapus</button></div></div>`).join("")+cfg||cfg+'<div class="empty">Belum ada pesan.</div>';
}
/* ---------- render ---------- */
const NAVG=[["Utama",[["h","Ringkasan",P.home]]],["Kelola",[["v","Vote",P.vote],["e","Jadwal",P.cal],["c","Konten",P.play],["f","Foto",P.img],["r","Rilisan",P.rel]]],["Komunikasi",[["a","Pengumuman",P.bell],["x","Pesan pembaca",P.mail],["s","Lagu",P.mus]]],["Sistem",[["p","Pengaturan",P.gear]]]];
const NAVALL=NAVG.flatMap(g=>g[1]);
const TITLES={v:"Vote",e:"Jadwal",c:"Konten",f:"Foto",r:"Rilisan",a:"Pengumuman",x:"Pesan pembaca",s:"Lagu",p:"Pengaturan"};
const FILT="vecf";
function render(){
  $("#app").style.display="block";document.body.classList.add("in");
  const r=actRel();
  const navItem=([k,l,p])=>{const n=k==="x"&&INBOX?INBOX.filter(m=>!m.is_read).length:0;return `<button data-tab="${k}" class="${tab===k?"on":""}"><span class="ic">${IC(p)}</span><span class="lb">${l}</span>${n?`<em>${n}</em>`:""}</button>`};
  $("#tabs").innerHTML=`<div class="sbrand"><div class="wm"><b>DREAM</b>LOOP</div><i>EDITOR</i></div>
   <div class="srel"><small>RILISAN AKTIF</small><b>${esc(r?r.title:"Boogie Woogie")}</b></div>
   ${NAVG.map(([g,items])=>`<div class="sg"><span class="gl">${g}</span><div class="gi">${items.map(navItem).join("")}</div></div>`).join("")}
   <div class="sfoot"><span class="st"><u></u>Terhubung</span><button data-tab="out" id="forget2">Keluar</button></div>`;
  const canAdd="vecas".includes(tab);const LBL={v:"vote",e:"jadwal",c:"konten",s:"lagu",a:"pengumuman"};
  const head=TITLES[tab]?`<div class="back"><h2>${TITLES[tab]}</h2></div>`:"";
  const search=canAdd?`<button class="addbtn" id="addb">+ Tambah ${LBL[tab]||""} baru</button>${"vec".includes(tab)?mfBar():""}${"vecs".includes(tab)?`<div class="bar"><input id="q" placeholder="Cari..." value="${esc(q)}"></div>`:""}`:(tab==="f"?mfBar():"");
  const body={h:tabHome,a:tabAnn,x:tabInbox,r:tabRel,v:tabVote,e:tabEvent,c:tabContent,s:tabSong,f:tabPhoto,p:tabSet}[tab]();
  const keep=document.activeElement&&document.activeElement.id==="q";
  $("#pane").innerHTML=head+search+body;if(keep){const x=$("#q");x.focus();x.setSelectionRange(99,99)}
  const on=$("#tabs .gi .on");if(on&&on.scrollIntoView&&innerWidth<900)on.scrollIntoView({inline:"center",block:"nearest"});
}
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.toLowerCase().trim();render()}});
const ADD={a:()=>annForm(),r:()=>relForm(),v:()=>voteForm(),e:()=>eventForm(),c:()=>contentForm(),s:()=>songForm()};
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("button");if(!t)return;
  try{
  if(t.id==="addb"){ADD[tab]&&ADD[tab]();return}
  if(t.id==="f_tpl"){const rk=val("f_rk");if(!rk||isNaN(rk))return msg("Isi peringkat dulu (angka).","bad");const x=winText(val("f_show"),val("f_phase"),rk,val("f_rv").replace(/\D/g,""),val("f_rp").replace(",","."));if($("#f_rn").value.trim()&&!confirm("Ganti teks yang sudah ada dengan template?"))return;$("#f_rn").value=x;return}
  if(t.id==="f_now"){$("#f_dl").value=wibLocal(new Date().toISOString());return}
  if(t.dataset.tab==="out"){try{localStorage.removeItem("token")}catch{}$("#token").value="";seed=null;$("#app").style.display="none";document.body.classList.remove("in");$("#setup").style.display="";msg("Token dihapus dari browser ini.","ok");return}
  if(t.dataset.tab){tab=t.dataset.tab;q="";render();scrollTo(0,0);return}
  const i=+t.dataset.i,a=t.dataset.act;
  if(a==="redit")relForm(i);if(a==="aedit")annForm(i);if(a==="ptag")photoTag(i);if(a==="adel"&&confirm("Hapus pengumuman ini?")){seed.announcements.splice(i,1);await save("Hapus pengumuman")}if(a==="vedit")voteForm(i);if(a==="eedit")eventForm(i);if(a==="cedit")contentForm(i);if(a==="sedit")songForm(i);
  if(a==="vdel"&&confirm("Hapus vote ini?\n"+seed.votes[i].show+" · "+seed.votes[i].phase)){seed.votes.splice(i,1);await save("Hapus vote")}
  if(a==="edel"&&confirm("Hapus jadwal ini?\n"+seed.events[i].title)){seed.events.splice(i,1);await save("Hapus jadwal")}
  if(a==="cdel"&&confirm("Hapus konten ini dari web?")){seed.content.splice(i,1);await save("Hapus konten")}
  if(a==="sdel"&&confirm("Hapus lagu ini?\n"+seed.songs[i].t)){seed.songs.splice(i,1);await save("Hapus lagu")}
  if(a==="pdel"&&confirm("Hapus foto ini?")){seed.moments.splice(i,1);await save("Hapus foto")}
  if(t.id==="reladd"){relForm();return}
  if(t.dataset.mf){mf=t.dataset.mf;render();return}
  if(t.dataset.cd){cal.sel=t.dataset.cd;render();return}
  if(t.dataset.cm){cal.m+=+t.dataset.cm;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}cal.sel=null;render();return}
  if(t.dataset.addday){eventForm(null,t.dataset.addday);return}

  if(t.dataset.go){const g=t.dataset.go;if(g==="win")winForm();if(g==="vote")voteForm();if(g==="event")eventForm();if(g==="content")contentForm();if(g==="photo"){tab="f";render()}return}
  if(t.dataset.need!=null){const n=(window.__need||[])[+t.dataset.need];if(!n)return;if(n.a==="win")winForm(n.show);if(n.a==="vedit")voteForm(n.i);if(n.a==="rel1"){tab="r";render()}return}
  if(t.id==="sbq"){const b=$("#sqlbox");b.style.display=b.style.display==="none"?"block":"none";return}
  if(t.id==="sqlc"){try{await navigator.clipboard.writeText(SQL);msg("SQL disalin.","ok")}catch{msg("Salin manual dari kotak.","bad")}return}
  if(t.id==="sbs"){SL("sb_url",$("#sbu").value);SL("sb_key",$("#sbk").value);SL("sb_pass",$("#sbp").value);t.disabled=true;try{INBOX=await sbrpc("read_messages",{})||[];render();msg("Pesan dimuat.","ok")}finally{t.disabled=false}return}
  if(t.dataset.act==="mread"){await sbrpc("manage_message",{msg_id:+t.dataset.id,act:t.dataset.r==="1"?"read":"unread"});INBOX=await sbrpc("read_messages",{})||[];render();return}
  if(t.dataset.act==="mdel"&&confirm("Hapus pesan ini permanen?")){await sbrpc("manage_message",{msg_id:+t.dataset.id,act:"delete"});INBOX=await sbrpc("read_messages",{})||[];render();return}
  if(t.id==="rel1"){const vid=(prompt("Kode video MV Boogie Woogie (11 huruf dari link YouTube):","wG7pnZttup8")||"").trim();if(!vid)return;const st=seed.settings||{};
    seed.releases.push({id:"boogie-woogie",active:true,type:"group",member:"NCT DREAM",title:"Boogie Woogie",album:"DREAM AFTER DREAM",tagline:"Track, stream, vote and follow every NCT DREAM and member activity.",banner:"assets/hero.jpg",release_at:seed.release_at||"2026-11-09T16:00:00+07:00",mv:{video_id:vid,target_views:st.target_views||10000000},wins:["The Show","Show Champion","M Countdown","Music Bank","Inkigayo","Music Core"].map(x=>({show:x,rank:null,date:""}))});
    seed.votes.forEach(v=>v.release=v.release||"boogie-woogie");seed.moments.forEach(m=>m.release=m.release||"boogie-woogie");seed.content.forEach(c=>c.release=c.release||"boogie-woogie");
    await save("Buat rilisan pertama");return}
  if(a==="ract"){seed.releases.forEach(r=>r.active=false);seed.releases[i].active=true;await save("Aktifkan rilisan: "+seed.releases[i].title)}
  if(a==="rdel"&&confirm("Hapus rilisan ini?\n"+seed.releases[i].title+"\n(vote/konten yang menempel tetap ada)")){const was=seed.releases[i].active;seed.releases.splice(i,1);if(was&&seed.releases[0])seed.releases[0].active=true;await save("Hapus rilisan")}
  if(t.id==="pup"){const fs=[...$("#pf").files];if(!fs.length)return msg("Pilih foto dulu.","bad");t.disabled=true;let n=0;
    for(const f of fs){const b64=await cropJpeg(f),name=`assets/photos/u-${Date.now()}-${n++}.jpg`;
      const r=await fetch(`https://api.github.com/repos/${$("#repo").value.trim()}/contents/${name}`,{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({message:"Tambah foto",content:b64,branch:br()})});
      if(!r.ok){t.disabled=false;throw new Error("Upload foto gagal ("+r.status+")")}seed.moments.unshift(applyRM({src:name}))}
    await save("Tambah foto Comeback moments")}
  if(t.id==="tgs"){const v=$("#tg").value.replace(/[^0-9]/g,"");seed.settings=seed.settings||{};if(v)seed.settings.target_views=+v;else delete seed.settings.target_views;await save("Ubah target views")}
  if(t.id==="oss"){const v=$("#osi").value.trim().replace(/[^\w-]/g,"");seed.settings=seed.settings||{};if(v)seed.settings.onesignal_app_id=v;else delete seed.settings.onesignal_app_id;await save("Atur notifikasi")}
  if(t.id==="gcs"){const v=$("#gcc").value.trim().replace(/[^\w-]/g,"");seed.settings=seed.settings||{};if(v)seed.settings.goatcounter=v;else delete seed.settings.goatcounter;await save("Atur statistik pengunjung")}
  if(t.id==="conn"){SL("repo",$("#repo").value);SL("branch",$("#branch").value);SL("token",$("#token").value);await load();msg("Terhubung.","ok")}
  if(t.id==="forget"){try{localStorage.removeItem("token")}catch{}$("#token").value="";seed=null;$("#app").style.display="none";document.body.classList.remove("in");$("#setup").style.display="";msg("Token dihapus dari browser ini.","ok")}
  }catch(e){msg(e.message,"bad")}
});
$("#repo").value=LS("repo");$("#branch").value=LS("branch")||"main";$("#token").value=LS("token");
if($("#repo").value&&$("#token").value)load().catch(e=>msg(e.message,"bad"));
</script></body></html>
